<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>ガジェット | Kame</title>
<meta name="description" content="Kame のガジェット">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <h1 class="sub">ガジェット</h1>

  <!-- 画像は admin.html の「画像」から gadgets/ にアップロードしてください。 -->
  <h2>スマホ</h2>
  <ul class="list gadget-list">
    <li class="glass gadget-card">
      <div class="gadget-photo"><span class="gadget-fallback" aria-hidden="true">📱</span><img src="gadgets/vivo-x200-pro-mini.jpg" alt="Vivo X200 Pro mini" loading="lazy" onerror="this.remove()"></div>
      <div class="gadget-info"><b>Vivo X200 Pro mini</b><span>カメラと性能が素晴らしい。</span></div>
    </li>
    <li class="glass gadget-card">
      <div class="gadget-photo"><span class="gadget-fallback" aria-hidden="true">📱</span><img src="gadgets/iphone-13-mini.jpg" alt="iPhone 13 mini" loading="lazy" onerror="this.remove()"></div>
      <div class="gadget-info"><b>iPhone 13 mini</b><span>小型なスマホはもちやすくて素晴らしい。</span></div>
    </li>
    <li class="glass gadget-card">
      <div class="gadget-photo"><span class="gadget-fallback" aria-hidden="true">📱</span><img src="gadgets/galaxy-s22.jpg" alt="Galaxy S22" loading="lazy" onerror="this.remove()"></div>
      <div class="gadget-info"><b>Galaxy S22</b><span>熱い</span></div>
    </li>
    <li class="glass gadget-card">
      <div class="gadget-photo"><span class="gadget-fallback" aria-hidden="true">📱</span><img src="gadgets/xperia-5-iv.jpg" alt="Xperia 5 IV" loading="lazy" onerror="this.remove()"></div>
      <div class="gadget-info"><b>Xperia5 IV</b><span>熱すぎ</span></div>
    </li>
    <li class="glass gadget-card">
      <div class="gadget-photo"><span class="gadget-fallback" aria-hidden="true">📱</span><img src="gadgets/nothing-phone-1.jpg" alt="Nothing Phone (1)" loading="lazy" onerror="this.remove()"></div>
      <div class="gadget-info"><b>Nothing Phone (1)</b><span>デザイン良すぎ</span></div>
    </li>
    <li class="glass gadget-card">
      <div class="gadget-photo"><span class="gadget-fallback" aria-hidden="true">📱</span><img src="gadgets/galaxy-s10e-exynos.jpg" alt="Galaxy S10e (Exynos)" loading="lazy" onerror="this.remove()"></div>
      <div class="gadget-info"><b>Galaxy S10e (Exynos)</b><span>カスロムで遊ぶ以外使い道が...</span></div>
    </li>
    <li class="glass gadget-card">
      <div class="gadget-photo"><span class="gadget-fallback" aria-hidden="true">📱</span><img src="gadgets/xperia-5.jpg" alt="Xperia 5" loading="lazy" onerror="this.remove()"></div>
      <div class="gadget-info"><b>Xperia 5</b><span>産廃</span></div>
    </li>
  </ul>

  <h2>ほかにも</h2>
  <ul class="tags">
    <li>PC</li>
    <li>イヤホン</li>
  </ul>
</main>
<script src="menu.js"></script>
</body>
</html>
