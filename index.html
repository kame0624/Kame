<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main id="top">
  <div class="hero">
    <!-- アイコン。ここを5回続けてタップすると隠しページへ -->
    <button class="avatar" id="shell" type="button" aria-label="Kame のアイコン">
      <img src="icon.jpg" width="104" height="104" alt="">
    </button>
    <h1>Kame</h1>
  </div>
  <p class="lead"></p>

  <h2 id="about">自己紹介</h2>
  <div class="glass">
    <p>maimai軽く遊んでいます。</p>
    <p>PC、スマホなど</p>
  </div>

  <h2>リンク</h2>
  <div class="link-tiles">
    <!-- アイコンを画像にしたいときは、svg の代わりに <img src="icons/名前.png" alt=""> を入れてください -->
    <a class="tile" href="https://maiscore.net/user/kameeeee" target="_blank" rel="noopener"><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg><img src="icons/maiscore.png" alt="" onload="this.previousElementSibling.remove()" onerror="this.remove()"></span><span>maiscore</span></a>
    <a class="tile" href="https://x.com/Kamekun242" target="_blank" rel="noopener"><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span><span>X</span></a>
  </div>

  <!-- 訪問者カウンター (Moe-Counter)。@の後ろの名前が、カウントを分ける名前です。他の人と同じ名前だと数が混ざるので、変えるときは長めの名前にしてください -->
  <div class="counter">
    <p>訪問者数</p>
    <img src="https://count.getloli.com/@kame0624-home?theme=moebooru" alt="訪問者数" loading="lazy" onerror="this.closest('.counter').remove()">
  </div>
</main>
<script>
// 隠しページへの入口: 甲羅を3秒以内に5回タップ
const SECRET = "kamestore-x7q2.html"; // 隠しページのファイル名(変えたらここも)
let taps = [];
document.getElementById("shell").addEventListener("click", () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000).concat(now);
  if (taps.length >= 5) location.href = SECRET;
});

</script>
<script src="menu.js?v=7"></script>
